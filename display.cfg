# DisplaySwitch 配置文件 (UTF-8)
# 修改后立即生效，无需重新编译。
#
# ===== 拉伸模式 =====
# 拉伸分辨率（显卡真实输出的分辨率，需先在 NVIDIA 控制面板里建好自定义分辨率）
stretch_width=1280
stretch_height=882
# 目标刷新率，0 = 自动挑选该分辨率下最高刷新率
stretch_refresh=0
# 拉伸画面输出到哪块屏：
#   external = 外接显示器/电视（同时禁用笔记本内置屏）
#   internal = 笔记本内置屏自己（不禁用任何屏）
#   auto     = 有外接屏就用外接屏，没有就用内置屏
stretch_target=internal
# 1 = 拉伸模式下禁用笔记本内置显示器（只在 stretch_target=external 时生效）
keep_external_only=1
# 1 = 拉伸模式下禁用目标显示器的「监视器」设备（解除 EDID 对分辨率的限制，
#     这正是让 NVIDIA 自定义分辨率真正生效的关键一步，需要管理员权限）
stretch_disable_monitor=1
# 1 = 回到日常模式时把「监视器」设备重新启用
daily_enable_monitor=0
#
# ===== 通用 =====
# 切换后等待多少毫秒再校验（显示器重配置是异步的，建议 >=1000）
settle_ms=1500
# 是否写日志 DisplaySwitch.log
log=1
# 遇到“拒绝访问”时是否自动以管理员身份重启自己
auto_elevate=1
# 找不到自定义分辨率时，是否自动打开 NVIDIA 控制面板
open_nvcp_on_missing=1
# 可选：手工指定哪块屏是「笔记本内置屏」——填显示器名的一部分即可。
# 留空表示由程序按接口类型自动判断（eDP / LVDS / INTERNAL 都算内置屏）。
# 用 list 命令可以看到每块屏的名字，例如提示里出现 TL160ADMP11-0 就填 TL160ADMP
internal_match=
# 可选：手工指定要禁用/启用的「监视器」设备。填设备实例ID或硬件ID的一部分，
# 例如 DISPLAY\TMX1601 或 MONITOR\TMX1601。用 list 命令可以看到候选。
monitor_match=

# 全局热键（图形版）：在任何程序里按下都能一键切换。留空 = 不注册。
hotkey=Ctrl+Alt+S
